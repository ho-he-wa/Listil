<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>グローバル設定</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        max-width: 500px;
        margin: auto;
        color: #333;
      }

      h2,
      h3 {
        margin-bottom: 10px;
        font-size: 18px;
      }

      .section {
        margin-bottom: 30px;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
      }

      .row label {
        flex: 1;
      }

      .row input[type="checkbox"] {
        transform: scale(1.2);
        margin-left: 10px;
      }

      button {
        padding: 4px 10px;
        font-size: 13px;
        cursor: pointer;
        min-width: 140px;
        height: 30px;
      }

      input[type="file"] {
        font-size: 13px;
      }

      .import-controls {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 10px;
        align-items: flex-start;
      }

      hr {
        margin: 30px 0;
        border: none;
        border-top: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <h2>グローバル設定</h2>

    <div class="section">
      <div class="row">
        <label for="global-toggle">拡張機能を有効にする</label>
        <input type="checkbox" id="global-toggle" />
      </div>
    </div>

    <hr />

    <div class="section">
      <h3>データのエクスポート・インポート</h3>

      <div class="row">
        <button id="export-button">設定をエクスポート</button>
      </div>

      <div class="import-controls">
        <input type="file" id="import-file" accept=".json" />
        <button id="import-button">設定をインポート</button>
      </div>
    </div>

    <script type="module" src="dashboard.js" defer></script>
  </body>
</html>
