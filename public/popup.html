<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Popup</title>
  <style>
    body {
      width: 250px;
      height: 180px;
      font-family: sans-serif;
      padding: 10px;
    }

    button,
    label {
      width: 100%;
      margin-top: 10px;
    }

    #toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* トグルスイッチ風スタイル */
    .switch {
      position: relative;
      display: inline-block;
      width: 66px;
      height: 24px;
      margin-left: 10px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    .switch input:checked+.slider {
      background-color: #4caf50;
    }

    .switch input:checked+.slider:before {
      transform: translateX(26px);
    }
  </style>
</head>

<body>
  <h1>Popup</h1>

  <div id="toggle-container">
    <label for="toggle-setting">有効 / 無効</label>
    <label class="switch">
      <input type="checkbox" id="toggle-setting" />
      <span class="slider"></span>
    </label>
  </div>

  <button id="global-settings-btn">グローバル設定</button>

  <div id="test-display"></div>

  <script src="./dist/popup.js" defer></script>
</body>

</html>
