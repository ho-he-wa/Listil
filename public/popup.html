<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Popup</title>
  <style>
    body {
      width: 250px;
      height: 180px;
      font-family: sans-serif;
      padding: 10px;
    }

    button,
    label {
      width: 100%;
      margin-top: 10px;
    }

    #toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
  </style>
</head>

<body>
  <h1>Popup</h1>

  <div id="toggle-container">
    <label for="toggle-setting">有効 / 無効</label>
    <input type="checkbox" id="toggle-setting" />
  </div>

  <button id="global-settings-btn">グローバル設定</button>

  <div id="test-display"></div>

  <script src="./dist/popup.js" defer></script>
</body>

</html>
